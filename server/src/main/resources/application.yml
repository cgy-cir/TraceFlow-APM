spring:
  application:
    name: traceflow-server
  datasource:
    url: ${TRACEFLOW_DB_URL:jdbc:mysql://localhost:3306/traceflow?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&connectionTimeZone=UTC}
    username: ${TRACEFLOW_DB_USERNAME:traceflow}
    password: ${TRACEFLOW_DB_PASSWORD:traceflow_dev}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jackson:
    time-zone: UTC

server:
  port: ${TRACEFLOW_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
