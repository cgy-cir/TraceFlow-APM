spring:
  application:
    name: traceflow-server
  profiles:
    default: dev
  datasource:
    url: ${TRACEFLOW_DB_URL:jdbc:mysql://localhost:3307/traceflow?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&connectionTimeZone=UTC}
    username: ${TRACEFLOW_DB_USERNAME:traceflow}
    password: ${TRACEFLOW_DB_PASSWORD:traceflow_dev}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jackson:
    time-zone: UTC

server:
  port: ${TRACEFLOW_SERVER_PORT:18080}

traceflow:
  performance:
    aggregation-enabled: ${TRACEFLOW_PERFORMANCE_AGGREGATION_ENABLED:true}
    aggregation-delay-ms: ${TRACEFLOW_PERFORMANCE_AGGREGATION_DELAY_MS:10000}
    aggregation-batch-size: ${TRACEFLOW_PERFORMANCE_AGGREGATION_BATCH_SIZE:1000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
