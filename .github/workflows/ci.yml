name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: server/pom.xml

      - name: Test
        run: ./mvnw --batch-mode --no-transfer-progress test

  e2e:
    name: Authentication, M2, M3 and M4 end-to-end
    needs: [frontend, backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: traceflow
          MYSQL_USER: traceflow
          MYSQL_PASSWORD: traceflow_dev
          MYSQL_ROOT_PASSWORD: traceflow_root_dev
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptraceflow_root_dev"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: server/pom.xml

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify M4 MySQL constraints
        working-directory: server
        env:
          TRACEFLOW_RUN_DB_TESTS: 'true'
        run: ./mvnw --batch-mode --no-transfer-progress -Dtest=ReleaseDatabaseTests test

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report and M4 evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  production:
    name: Production image and gateway checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: server/pom.xml
      - run: npm ci
      - run: npm run build -w @traceflow/shared && npm run build -w @traceflow/console
      - name: Package backend
        working-directory: server
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package
      - name: Validate shell scripts and production Compose
        env:
          SERVER_IMAGE: traceflow-server-check:local
          WEB_IMAGE: traceflow-web-check:local
        run: |
          bash -n deploy/preflight.sh deploy/deploy-platform.sh deploy/deploy-demo.sh deploy/check-web.sh
          docker compose --env-file deploy/.env.production.example -f deploy/compose.production.yml config --quiet
      - name: Check deployment shell safety
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck deploy/preflight.sh deploy/deploy-platform.sh deploy/deploy-demo.sh deploy/check-web.sh
      - name: Build runtime images
        run: |
          docker build -f deploy/server.Dockerfile -t traceflow-server-check:local .
          docker build -f deploy/web.Dockerfile -t traceflow-web-check:local .
          docker run --rm --entrypoint java traceflow-server-check:local -version
          docker run --rm --entrypoint wget traceflow-server-check:local --help
      - name: Check static routing, API proxy and private files
        run: bash deploy/check-web.sh traceflow-web-check:local
      - name: Verify isolated production stack and secure login
        run: node deploy/check-platform.mjs
