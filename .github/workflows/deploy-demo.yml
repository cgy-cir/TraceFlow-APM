name: Deploy Demo

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full main commit SHA with successful CI
        required: true
        type: string
      application_id:
        description: Existing production application ID (blank creates or reuses Demo Web)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - id: verify
        uses: actions/github-script@v7
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
        with:
          script: |
            if (context.ref !== 'refs/heads/main') throw new Error('Run from main');
            const sha = process.env.REQUESTED_COMMIT;
            if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('Full lowercase commit SHA required');
            const comparison = await github.rest.repos.compareCommits({ ...context.repo, base: sha, head: 'main' });
            if (!['ahead', 'identical'].includes(comparison.data.status)) throw new Error('Commit is not on main');
            const runs = await github.rest.actions.listWorkflowRuns({ ...context.repo, workflow_id: 'ci.yml', head_sha: sha, branch: 'main', event: 'push', per_page: 100 });
            const run = runs.data.workflow_runs.filter(item => item.head_sha === sha).sort((a, b) => b.id - a.id)[0];
            if (!run || run.status !== 'completed' || run.conclusion !== 'success') throw new Error('Latest push CI must succeed');
            core.setOutput('commit', sha);

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://demo.revengedog.online
    env:
      TRACEFLOW_API_BASE: https://apm.revengedog.online/api/v1
      TRACEFLOW_DEMO_ORIGIN: https://demo.revengedog.online
      DEMO_COMMIT: ${{ needs.verify.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Create or verify the production monitoring application
        env:
          DEMO_APPLICATION_ID: ${{ inputs.application_id }}
          TRACEFLOW_UPLOAD_EMAIL: ${{ secrets.TRACEFLOW_UPLOAD_EMAIL }}
          TRACEFLOW_UPLOAD_PASSWORD: ${{ secrets.TRACEFLOW_UPLOAD_PASSWORD }}
        run: node scripts/production-demo.mjs configure
      - name: Build once with the real production SDK configuration
        env:
          VITE_TRACEFLOW_ENDPOINT: https://apm.revengedog.online/api/v1/events/batch
          VITE_TRACEFLOW_ENVIRONMENT: production
        run: npm run build:demo:release -- --release "$DEMO_RELEASE" --url-prefix /
      - name: Upload private Source Maps and finalize the release
        env:
          TRACEFLOW_UPLOAD_EMAIL: ${{ secrets.TRACEFLOW_UPLOAD_EMAIL }}
          TRACEFLOW_UPLOAD_PASSWORD: ${{ secrets.TRACEFLOW_UPLOAD_PASSWORD }}
        run: node scripts/production-demo.mjs upload
      - name: Prepare public assets from the exact uploaded build
        run: node scripts/production-demo.mjs public
      - name: Publish and verify public files over pinned SSH and trusted HTTPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          [[ $SSH_HOST =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ && $SSH_USER =~ ^[a-zA-Z0-9_][a-zA-Z0-9_-]*$ && $SSH_PORT =~ ^[0-9]{1,5}$ ]] || exit 1
          (( 10#$SSH_PORT >= 1 && 10#$SSH_PORT <= 65535 )) || exit 1
          [[ -n $SSH_PRIVATE_KEY && -n $SSH_KNOWN_HOSTS ]] || { echo 'SSH secrets required'; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          remote="/opt/traceflow/demo/releases/$DEMO_COMMIT-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          args=(-i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          ssh "${args[@]}" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "umask 077; mkdir -p '$remote/public'"
          scp "${args[@]}" -P "$SSH_PORT" -r apps/demo/dist-public-production/. "$SSH_USER@$SSH_HOST:$remote/public/"
          scp "${args[@]}" -P "$SSH_PORT" deploy/deploy-demo.sh "$SSH_USER@$SSH_HOST:$remote/"
          scp "${args[@]}" -P "$SSH_PORT" demo-checksums.sha256 "$SSH_USER@$SSH_HOST:$remote/checksums.sha256"
          ssh "${args[@]}" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "bash '$remote/deploy-demo.sh'"
      - name: Register the successful deployment timestamp
        env:
          TRACEFLOW_UPLOAD_EMAIL: ${{ secrets.TRACEFLOW_UPLOAD_EMAIL }}
          TRACEFLOW_UPLOAD_PASSWORD: ${{ secrets.TRACEFLOW_UPLOAD_PASSWORD }}
        run: node scripts/production-demo.mjs record
      - run: npx playwright install --with-deps chromium
      - name: Verify real browser SDK reporting and App.tsx source resolution
        env:
          TRACEFLOW_UPLOAD_EMAIL: ${{ secrets.TRACEFLOW_UPLOAD_EMAIL }}
          TRACEFLOW_UPLOAD_PASSWORD: ${{ secrets.TRACEFLOW_UPLOAD_PASSWORD }}
        run: node scripts/production-demo.mjs smoke
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: demo-publication-evidence
          path: |
            demo-deployment.json
            demo-checksums.sha256
            demo-live-*.png
          retention-days: 7
